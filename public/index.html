<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive → Gofile</title>

<style>
:root{
  --bg:#0f172a;
  --card:rgba(2,6,23,.75);
  --text:#ffffff;
  --muted:#94a3b8;
  --accent:#22c55e;
  --glow:rgba(34,197,94,.6);
}

.light{
  --bg:#f8fafc;
  --card:rgba(255,255,255,.9);
  --text:#020617;
  --muted:#64748b;
  --accent:#16a34a;
  --glow:rgba(22,163,74,.4);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(34,197,94,.18), transparent 40%),
    var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
  transition:.3s;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:pop .5s ease;
}

@keyframes pop{
  from{transform:scale(.96);opacity:0}
  to{transform:scale(1);opacity:1}
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{
  margin:0;
  font-size:22px;
}

.toggle{
  width:44px;
  height:24px;
  background:#020617;
  border-radius:999px;
  position:relative;
  cursor:pointer;
}

.toggle::after{
  content:"";
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.3s;
}

.light .toggle{background:#cbd5f5}
.light .toggle::after{left:23px;background:#020617}

.sub{
  margin:8px 0 14px;
  font-size:13px;
  color:var(--muted);
}

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  outline:none;
  background:rgba(2,6,23,.7);
  color:var(--text);
  font-size:14px;
}

.light input{background:#e5e7eb}

.meta{
  margin-top:8px;
  font-size:13px;
  color:var(--muted);
}

button{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#22c55e,#4ade80);
  color:#022c22;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

button.loading{
  pointer-events:none;
  opacity:.85;
}

button.loading::after{
  content:"";
  width:20px;
  height:20px;
  border:3px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:translate(-50%,-50%) rotate(360deg)}
}

.progress{
  margin-top:18px;
  width:100%;
  height:12px;
  background:rgba(2,6,23,.7);
  border-radius:999px;
  overflow:hidden;
  display:none;
}

.light .progress{background:#e5e7eb}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  box-shadow:0 0 12px var(--glow);
  transition:width .25s ease;
}

.result{
  margin-top:14px;
  font-size:14px;
  text-align:center;
  word-break:break-all;
}

.result a{
  color:var(--accent);
  font-weight:600;
  text-decoration:none;
}

footer{
  margin-top:22px;
  font-size:12px;
  text-align:center;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h1>Drive → Gofile</h1>
    <div class="toggle" onclick="toggleTheme()"></div>
  </div>

  <p class="sub">Upload public Google Drive files</p>

  <input id="url" placeholder="Paste Google Drive public link">
  <div class="meta" id="meta"></div>

  <button id="btn" onclick="startUpload()">Upload</button>

  <div class="progress" id="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="result" id="result"></div>

  <footer>MADE WITH ❤️‍🩹 BY <b>ANIME-CRUZE</b></footer>
</div>

<script>
const root = document.documentElement;
if(localStorage.theme==="light") root.classList.add("light");

function toggleTheme(){
  root.classList.toggle("light");
  localStorage.theme = root.classList.contains("light")?"light":"dark";
}

let infoTimer;

url.oninput = () => {
  clearTimeout(infoTimer);
  meta.textContent = "";
  infoTimer = setTimeout(async () => {
    if(!url.value.includes("drive.google.com")) return;
    meta.textContent = "Detecting file info…";
    try{
      const r = await fetch(`/api/drive-info?url=${encodeURIComponent(url.value)}`);
      const d = await r.json();
      if(d.fileName){
        meta.innerHTML = `📄 <b>${d.fileName}</b><br>📦 ${d.fileSize}`;
      }
    }catch{
      meta.textContent = "Failed to detect file info";
    }
  },600);
};

function startUpload(){
  if(!url.value) return alert("Paste Drive link");

  progress.style.display="block";
  bar.style.width="0%";
  result.textContent="";
  btn.classList.add("loading");
  btn.textContent="";

  const es = new EventSource("/api/progress");
  es.onmessage = e => bar.style.width = e.data+"%";

  fetch("/api/upload",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ drive_url:url.value })
  })
  .then(r=>r.json())
  .then(d=>{
    es.close();
    btn.classList.remove("loading");
    btn.textContent="Upload";
    result.innerHTML = d.success
      ? `<a href="${d.link}" target="_blank">${d.link}</a>`
      : d.error;
  })
  .catch(()=>{
    es.close();
    btn.classList.remove("loading");
    btn.textContent="Upload";
    result.textContent="Server error";
  });
}
</script>

</body>
</html>
