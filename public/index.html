<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive → Gofile</title>

<style>
/* ================= THEME ================= */
:root{
  --bg1:#020617;
  --bg2:#0f172a;
  --accent:#22c55e;
  --text:#ffffff;
  --muted:#94a3b8;
}

.light{
  --bg1:#e2e8f0;
  --bg2:#f8fafc;
  --accent:#16a34a;
  --text:#020617;
  --muted:#64748b;
}

/* ================= BASE ================= */
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  color:var(--text);
  overflow:hidden;
}

/* ================= ANIMATED BACKGROUND ================= */
.bg{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg1));
  background-size:400% 400%;
  animation:bgMove 18s ease infinite;
}

/* Floating blobs */
.bg::before,
.bg::after{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:radial-gradient(circle, var(--accent), transparent 60%);
  filter:blur(120px);
  opacity:.35;
  animation:float 22s ease-in-out infinite;
}

.bg::after{
  width:360px;
  height:360px;
  animation-duration:28s;
  animation-delay:-8s;
  opacity:.25;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

@keyframes float{
  0%{transform:translate(10%,10%)}
  50%{transform:translate(60%,40%)}
  100%{transform:translate(10%,10%)}
}

/* ================= APP LAYOUT ================= */
.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

/* Header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
}

h1{
  margin:0;
  font-size:20px;
}

/* Theme toggle */
.toggle{
  width:44px;
  height:24px;
  background:#020617;
  border-radius:999px;
  position:relative;
  cursor:pointer;
}

.toggle::after{
  content:"";
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.3s;
}

.light .toggle{background:#cbd5f5}
.light .toggle::after{left:23px;background:#020617}

/* Content */
.content{
  flex:1;
  padding:16px;
}

.sub{
  margin:0 0 12px;
  font-size:13px;
  color:var(--muted);
}

input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:none;
  outline:none;
  background:rgba(255,255,255,.08);
  color:var(--text);
  font-size:14px;
  backdrop-filter:blur(8px);
}

.light input{background:rgba(0,0,0,.05)}

.meta{
  margin-top:8px;
  font-size:13px;
  color:var(--muted);
}

button{
  width:100%;
  margin-top:16px;
  padding:16px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#22c55e,#4ade80);
  color:#022c22;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  position:relative;
}

button.loading{
  pointer-events:none;
  opacity:.85;
}

/* Progress */
.progress{
  margin-top:18px;
  width:100%;
  height:12px;
  background:rgba(255,255,255,.1);
  border-radius:999px;
  overflow:hidden;
  display:none;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  box-shadow:0 0 14px rgba(34,197,94,.8);
  transition:width .25s ease;
}

.result{
  margin-top:14px;
  font-size:14px;
  word-break:break-all;
}

.result a{
  color:var(--accent);
  font-weight:600;
  text-decoration:none;
}

/* Footer */
footer{
  padding:14px;
  font-size:12px;
  text-align:center;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="app">

  <div class="header">
    <h1>Drive → Gofile</h1>
    <div class="toggle" onclick="toggleTheme()"></div>
  </div>

  <div class="content">
    <p class="sub">Upload public Google Drive files</p>

    <input id="url" placeholder="Paste Google Drive public link">
    <div class="meta" id="meta"></div>

    <button id="btn" onclick="startUpload()">Upload</button>

    <div class="progress" id="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="result" id="result"></div>
  </div>

  <footer>MADE WITH ❤️‍🩹 BY <b>ANIME-CRUZE</b></footer>

</div>

<script>
const root = document.documentElement;
if(localStorage.theme==="light") root.classList.add("light");

function toggleTheme(){
  root.classList.toggle("light");
  localStorage.theme = root.classList.contains("light") ? "light" : "dark";
}

/* Drive info */
let infoTimer;
url.oninput = () => {
  clearTimeout(infoTimer);
  meta.textContent="";
  infoTimer=setTimeout(async()=>{
    if(!url.value.includes("drive.google.com"))return;
    meta.textContent="Detecting file info…";
    try{
      const r=await fetch(`/api/drive-info?url=${encodeURIComponent(url.value)}`);
      const d=await r.json();
      if(d.fileName)
        meta.innerHTML=`📄 <b>${d.fileName}</b><br>📦 ${d.fileSize}`;
    }catch{
      meta.textContent="Failed to detect file info";
    }
  },600);
};

/* Upload */
function startUpload(){
  if(!url.value)return alert("Paste Drive link");

  progress.style.display="block";
  bar.style.width="0%";
  result.textContent="";
  btn.classList.add("loading");

  const es=new EventSource("/api/progress");
  es.onmessage=e=>bar.style.width=e.data+"%";

  fetch("/api/upload",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({drive_url:url.value})
  })
  .then(r=>r.json())
  .then(d=>{
    es.close();
    btn.classList.remove("loading");
    result.innerHTML=d.success
      ? `<a href="${d.link}" target="_blank">${d.link}</a>`
      : d.error;
  })
  .catch(()=>{
    es.close();
    btn.classList.remove("loading");
    result.textContent="Server error";
  });
}
</script>

</body>
</html>
